<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zamen • زامِن | مزامن المقاطع الصوتية والفيديو</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1 data-i18n="app.title"></h1>
    <p data-i18n="app.subtitle"></p>
  </div>
  <button id="langBtn" class="btn ghost" type="button">English</button>
</header>

<main>

  <!-- Drop zone -->
  <section id="dropZone" class="card dropzone" tabindex="0">
    <input type="file" id="fileInput" accept="audio/*,video/*,.mp3,.wav,.m4a,.aac,.ogg,.oga,.flac,.opus,.weba,.webm,.mp4,.m4v,.mov,.mkv,.avi,.3gp,.ogv" multiple hidden>
    <div class="dz-icon">&#127911;</div>
    <div class="dz-title" data-i18n="drop.title"></div>
    <div class="dz-hint" data-i18n="drop.hint"></div>
  </section>

  <!-- Clips list -->
  <section id="clipsPanel" class="card" hidden>
    <div class="panel-head">
      <h2><span data-i18n="clips.title"></span> <span id="clipCount" class="badge"></span></h2>
      <div class="head-actions">
        <button id="sortNameBtn" class="btn ghost sm" type="button" data-i18n="clips.sortByName"></button>
        <button id="clearAllBtn" class="btn danger sm" type="button" data-i18n="clips.clearAll"></button>
      </div>
    </div>
    <ul id="clipList"></ul>
    <p id="refHint" class="hint" data-i18n="set.refHint" hidden></p>
  </section>

  <!-- Settings -->
  <section id="settingsPanel" class="card">
    <h2 data-i18n="set.title"></h2>

    <div class="grid">

      <div class="field">
        <label for="modeSelect" data-i18n="set.mode"></label>
        <select id="modeSelect">
          <option value="sync" data-i18n="set.modeSync"></option>
          <option value="seq" data-i18n="set.modeSeq"></option>
          <option value="ref" data-i18n="set.modeRef"></option>
        </select>
      </div>

      <div class="field">
        <label for="offsetInput" data-i18n="set.offset"></label>
        <input id="offsetInput" type="text" dir="ltr" placeholder="0">
        <small data-i18n="set.offsetHint"></small>
      </div>

      <div class="field">
        <label for="gapInput" data-i18n="set.gap"></label>
        <input id="gapInput" type="number" min="0" step="0.1" value="0" dir="ltr">
      </div>

      <div class="field">
        <label for="tcFormatSel" data-i18n="set.tcFormat"></label>
        <select id="tcFormatSel">
          <option value="ms" data-i18n="set.tcMs"></option>
          <option value="frames" data-i18n="set.tcFrames"></option>
        </select>
      </div>

      <div class="field" id="fpsField">
        <label for="fpsSel" data-i18n="set.fps"></label>
        <select id="fpsSel">
          <option value="23.976">23.976</option>
          <option value="24">24</option>
          <option value="25">25</option>
          <option value="29.97">29.97</option>
          <option value="30" selected>30</option>
        </select>
      </div>

      <div class="field range-field">
        <label for="threshRange"><span data-i18n="set.thresh"></span> <output id="threshOut"></output></label>
        <input id="threshRange" type="range" min="-70" max="-20" step="1" value="-40">
      </div>

      <div class="field range-field" id="confField" hidden>
        <label for="confRange"><span data-i18n="set.conf"></span> <output id="confOut"></output></label>
        <input id="confRange" type="range" min="10" max="95" step="5" value="45">
      </div>

      <div class="field check-field">
        <label><input id="trimChk" type="checkbox" checked> <span data-i18n="set.trim"></span></label>
      </div>

      <div class="field check-field" id="driftField">
        <label><input id="driftChk" type="checkbox" checked> <span data-i18n="set.drift"></span></label>
      </div>

    </div>
  </section>

  <!-- Process -->
  <div class="process-row">
    <button id="processBtn" class="btn primary lg" type="button" data-i18n="btn.process"></button>
    <div class="progress-wrap" hidden>
      <progress id="progressBar" max="100" value="0"></progress>
      <span id="statusText"></span>
    </div>
  </div>

  <!-- Results -->
  <section id="resultsPanel" class="card" hidden>
    <h2 data-i18n="res.title"></h2>
    <div class="table-wrap">
      <table id="resultsTable">
        <thead>
          <tr>
            <th>#</th>
            <th data-i18n="col.name"></th>
            <th data-i18n="col.start"></th>
            <th data-i18n="col.end"></th>
            <th data-i18n="col.dur"></th>
            <th id="driftHead" data-i18n="col.drift"></th>
            <th id="confHead" data-i18n="col.conf"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <h3 data-i18n="exp.title"></h3>
    <div class="exports">
      <button class="btn" data-fmt="csv" type="button">CSV</button>
      <button class="btn" data-fmt="srt" type="button">SRT</button>
      <button class="btn" data-fmt="json" type="button">JSON</button>
      <button class="btn" data-fmt="labels" type="button" data-i18n="exp.labels"></button>
      <button class="btn" data-fmt="edl" type="button">EDL</button>
      <button class="btn" data-fmt="fcpxml" type="button">FCPXML</button>
      <button class="btn" data-fmt="txt" type="button">TXT</button>
      <button class="btn ghost" data-fmt="copyjson" type="button" data-i18n="exp.copyJson"></button>
    </div>
  </section>

</main>

<footer data-i18n="footer.note"></footer>

<div id="toast" class="toast" hidden></div>

<script src="js/i18n.js"></script>
<script src="js/dsp.js"></script>
<script src="js/sync.js"></script>
<script src="js/exporters.js"></script>
<script src="js/app.js"></script>
</body>
</html>
